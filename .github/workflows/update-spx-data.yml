name: Update SPX Market Data

on:
  schedule:
    - cron: '0 21 * * 1-5'  # Monday-Friday at 9 PM UTC OR 2 PM PST
  workflow_dispatch:  # Allows manual triggering

jobs:
  update-data:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3
        
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'
          
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          
      - name: Run update script
        run: |
          python src/hourly_analysis/build.py
          
      - name: Commit and push if changes
        run: |
          git config --global user.name 'GitHub Actions Bot'
          git config --global user.email 'actions@github.com'
          git add public/intraday/data/intraday_table.json public/intraday/static/intraday_table.html public/first-hour/data/analysis.json public/thirty-min/data/thirty_min_table.json public/thirty-min/static/thirty_min_table.html
          git diff --quiet && git diff --staged --quiet || (git commit -m "Auto-update SPX market data [skip ci]" && git push)
